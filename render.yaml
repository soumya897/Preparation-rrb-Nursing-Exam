services:
  - type: web
    name: rrb-nursing-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/days
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: true # Set in Render Dashboard: postgresql://postgres:[YOUR-PASSWORD]@db.[YOUR-PROJECT-REF].supabase.co:5432/postgres
      - key: DATABASE_USERNAME
        sync: true # postgres
      - key: DATABASE_PASSWORD
        sync: true
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:3000,http://localhost:5173"
